name: Testes
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  testes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Cadastro (Lambda)
        working-directory: backend/cadastro
        run: npm test
      - name: Jogo
        working-directory: jogo
        run: npm ci && npm test
      - uses: hashicorp/setup-terraform@v3
      - name: Terraform
        working-directory: infra
        run: terraform fmt -check && terraform init -backend=false -input=false && terraform validate
